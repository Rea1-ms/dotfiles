# One prompt configuration shared by Bash, Fish, Zsh and PowerShell.
add_newline = false
palette = "omp"

format = """
$os\
$username\
$hostname\
$cmd_duration\
$directory\
$python\
$nodejs\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$sudo\
$line_break\
$character"""

[palettes.omp]
slate = "#546E7A"
cyan = "#26C6DA"
ink = "#193549"
directory = "#14C2DD"
git = "#A2C4E0"
python = "#306998"
python_yellow = "#FFE873"
node = "#6CA35E"
green = "#007800"
red = "#F1184C"
duration = "#FFCD58"
white = "#FFFFFF"

[os]
disabled = false
format = "$symbol "

[os.symbols]
Alpine = "[](fg:#0D597F)[ \uf300 ](fg:#FFFFFF bg:#0D597F)[](fg:#0D597F)"
Android = "[](fg:#3DDC84)[ \uf17b ](fg:#193549 bg:#3DDC84)[](fg:#3DDC84)"
Arch = "[](fg:#1793D1)[ \uf303 ](fg:#FFFFFF bg:#1793D1)[](fg:#1793D1)"
CentOS = "[](fg:#932279)[ \uf304 ](fg:#FFFFFF bg:#932279)[](fg:#932279)"
Debian = "[](fg:#D70A53)[ \uf306 ](fg:#FFFFFF bg:#D70A53)[](fg:#D70A53)"
EndeavourOS = "[](fg:#7F3FBF)[ \uf322 ](fg:#FFFFFF bg:#7F3FBF)[](fg:#7F3FBF)"
Fedora = "[](fg:#294172)[ \uf30a ](fg:#FFFFFF bg:#294172)[](fg:#294172)"
FreeBSD = "[](fg:#AB2B28)[ \uf30c ](fg:#FFFFFF bg:#AB2B28)[](fg:#AB2B28)"
Gentoo = "[](fg:#54487A)[ \uf30d ](fg:#FFFFFF bg:#54487A)[](fg:#54487A)"
Kali = "[](fg:#557C94)[ \uf327 ](fg:#FFFFFF bg:#557C94)[](fg:#557C94)"
Linux = "[](fg:slate)[ \uf17c ](fg:cyan bg:slate)[](fg:slate)"
Manjaro = "[](fg:#35BF5C)[ \uf312 ](fg:#193549 bg:#35BF5C)[](fg:#35BF5C)"
Mint = "[](fg:#87CF3E)[ \uf30e ](fg:#193549 bg:#87CF3E)[](fg:#87CF3E)"
NixOS = "[](fg:#5277C3)[ \uf313 ](fg:#FFFFFF bg:#5277C3)[](fg:#5277C3)"
openSUSE = "[](fg:#73BA25)[ \uf314 ](fg:#193549 bg:#73BA25)[](fg:#73BA25)"
Pop = "[](fg:#48B9C7)[ \uf32a ](fg:#193549 bg:#48B9C7)[](fg:#48B9C7)"
Raspbian = "[](fg:#C51A4A)[ \uf315 ](fg:#FFFFFF bg:#C51A4A)[](fg:#C51A4A)"
Ubuntu = "[](fg:#E95420)[ \uf31b ](fg:#FFFFFF bg:#E95420)[](fg:#E95420)"
Void = "[](fg:#478061)[ \uf32e ](fg:#FFFFFF bg:#478061)[](fg:#478061)"
Windows = "[](fg:#0078D4)[ \uf17a ](fg:#FFFFFF bg:#0078D4)[](fg:#0078D4)"
Macos = "[](fg:#555555)[ \uf179 ](fg:#FFFFFF bg:#555555)[](fg:#555555)"
Unknown = "[](fg:slate)[ ? ](fg:cyan bg:slate)[](fg:slate)"

[username]
show_always = true
style_user = "fg:cyan bg:slate"
style_root = "bold fg:red bg:slate"
format = "[](fg:slate)[ $user]($style)"

[hostname]
ssh_only = false
trim_at = "."
style = "fg:cyan bg:slate"
format = "[@$hostname ]($style)[](fg:slate) "

[directory]
style = "fg:ink bg:directory"
read_only = " 󰌾"
truncation_length = 4
truncate_to_repo = false
format = "[](fg:directory)[  $path$read_only ]($style)[](fg:directory) "

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Projects" = "󰲋 "

[python]
symbol = " "
style = "fg:python_yellow bg:python"
format = '[](fg:python)[ $symbol$version( \($virtualenv\)) ]($style)[](fg:python) '

[nodejs]
symbol = " "
style = "fg:white bg:node"
format = "[](fg:node)[ $symbol$version ]($style)[](fg:node) "

[git_branch]
symbol = " "
style = "fg:ink bg:git"
format = "[](fg:git)[ $symbol$branch(:$remote_branch) ]($style)"

[git_commit]
commit_hash_length = 7
only_detached = true
tag_disabled = false
tag_symbol = "  "
style = "fg:ink bg:git"
format = "[ $hash$tag ]($style)"

[git_state]
style = "bold fg:red bg:git"
format = "[$state( $progress_current/$progress_total) ]($style)"

[git_metrics]
disabled = false
only_nonzero_diffs = true
added_style = "bold fg:green bg:git"
deleted_style = "bold fg:red bg:git"
format = "([+$added ]($added_style))([-$deleted ]($deleted_style))"

[git_status]
style = "fg:ink bg:git"
format = "[$all_status$ahead_behind ]($style)[](fg:git) "
stashed = " ${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
conflicted = "=${count} "
untracked = "?${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[sudo]
disabled = false
symbol = " "
style = "fg:ink bg:duration"
format = "[](fg:duration)[ $symbol]($style)[](fg:duration) "

[cmd_duration]
min_time = 2_000
show_milliseconds = false
style = "fg:ink bg:duration"
format = "[](fg:duration)[ 󰔛 $duration ]($style)[](fg:duration) "

[character]
success_symbol = "[➜](bold #007ACC) "
error_symbol = "[➜](bold red) "